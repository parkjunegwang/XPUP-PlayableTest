<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Drag Triple Cell Move Playable v4</title>
<style>
:root{--bg1:#eef8ff;--bg2:#dff2ff;--panel:#ffffffcc;--cell:linear-gradient(180deg,#cfeeff 0%,#bfe6fb 100%);--accent:#4a9fe8;--text:#224}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text);touch-action:none;user-select:none}
#app{width:100%;height:100%;display:flex;justify-content:center;align-items:stretch}
.game{width:min(100vw,1080px);height:100%;padding:10px 10px 14px;display:flex;flex-direction:column;gap:10px;position:relative}
.hud{background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:10px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;box-shadow:0 5px 18px rgba(60,120,180,.12)}
.leftBox,.rightBox{display:flex;flex-direction:column;gap:6px}.titleSmall{font-size:16px;font-weight:800}
.counter{background:#fff;border:3px solid #8b9fc0;border-radius:16px;font-weight:900;font-size:18px;padding:5px 12px;min-width:86px;text-align:center}
.timerWrap{display:flex;flex-direction:column;align-items:center;gap:4px}.timer{font-size:46px;font-weight:900;line-height:1}
.barOuter{width:130px;height:10px;border-radius:999px;background:#d6ecd6;overflow:hidden;border:2px solid #789c78}.barInner{height:100%;width:100%;background:linear-gradient(90deg,#98e08e,#6fc76c)}
.board{
  flex:1;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  column-gap:2px;
  row-gap:-100px;
  min-height:0;
}
.cell{
  position:relative;
  border-radius:10px;
  border:2px solid var(--line);
  background: url('images/Background_tray.png') center center / 100% 55% no-repeat;
  min-height:20px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55);
  overflow:hidden;
  transition:transform .10s ease,box-shadow .10s ease,border-color .10s ease;
}


.cell.invalid{animation:shake .28s linear}

.piece{
  position:absolute;width:43%;aspect-ratio:.82;border-radius:16px;display:flex;align-items:center;justify-content:center;
  
  transition:left .12s ease, top .12s ease, opacity .12s ease, transform .12s ease;
}
.piece img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.piece span{line-height:1;pointer-events:none}
.piece.draggable{cursor:grab;touch-action:none}
.piece.source-hidden{opacity:.22}
.slotBadge{position:absolute;bottom:4px;right:6px;font-size:10px;font-weight:900;color:rgba(30,60,100,.35);pointer-events:none}
.controls{display:flex;gap:8px;justify-content:center;align-items:center}
.btn{border:none;border-radius:14px;background:var(--accent);color:white;font-weight:800;padding:10px 16px;font-size:16px;box-shadow:0 4px 12px rgba(74,159,232,.25)}
.btn.cta{background:linear-gradient(180deg,#65d667,#42bb4b)}
.toast{position:absolute;left:50%;top:94px;transform:translateX(-50%);background:#25364be6;color:white;padding:8px 14px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:5}
.toast.show{opacity:1}.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(14,34,58,.35);z-index:20}.overlay.show{display:flex}
.modal{width:min(90%,360px);background:white;border-radius:24px;border:4px solid var(--line);text-align:center;padding:22px 18px;box-shadow:0 14px 40px rgba(0,0,0,.2)}
.modal h2{margin:0 0 10px;font-size:32px}.modal p{margin:0 0 16px;font-size:17px}.modal .btn{width:100%;font-size:20px;padding:14px}
.drag-ghost{
  position:fixed; width:110px; aspect-ratio:.82; border-radius:14px; display:flex; align-items:center; justify-content:center;
 
  font-size:26px; z-index:9999; pointer-events:none; transform:translate(-50%,-50%) scale(.92);
}
.drag-ghost img{width:84%;height:84%;object-fit:contain;pointer-events:none}
.drag-ghost .slotBadge{display:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

@keyframes matchFlash{
  0%{transform:scale(1);filter:brightness(1)}
  20%{transform:scale(1.06);filter:brightness(1.9)}
  40%{transform:scale(1.02);filter:brightness(1.5)}
  60%{transform:scale(1.08);filter:brightness(2.2)}
  100%{transform:scale(1);filter:brightness(1)}
}
@keyframes starBurst{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) translate(0,0) scale(.35) rotate(0deg);
  }
  15%{
    opacity:1;
  }
  100%{
    opacity:0;
    transform:translate(-50%,-50%) translate(var(--dx), var(--dy)) scale(1.15) rotate(160deg);
  }
}
.cell.match-flash{
  animation:matchFlash .22s ease-out;
}
.star-particle{
  position:absolute;
  left:50%;
  top:50%;
  font-size:22px;
  line-height:1;
  pointer-events:none;
  z-index:8;
  opacity:0;
  animation:starBurst .5s ease-out forwards;
  filter:drop-shadow(0 0 6px rgba(255,255,170,.95));
}

</style>
</head>
<body>
<div id="app"><div class="game">
<div class="hud">
<div class="leftBox"><div class="titleSmall">Level 10</div><div class="counter"><span id="progress">0</span> / <span id="goal">12</span></div></div>
<div class="timerWrap"><div class="timer" id="timer">00:45</div><div class="barOuter"><div class="barInner" id="timeBar"></div></div></div>
<div class="rightBox" style="align-items:flex-end;"><div class="titleSmall">Moves</div><div class="counter" id="moves">0</div></div>
</div>
<div class="toast" id="toast"></div>
<div class="board" id="board"></div>
<div class="controls"><button class="btn" id="restartBtn">retry</button><button class="btn cta" id="ctaBtn">Install</button></div>
<div class="overlay" id="overlay"><div class="modal"><h2 id="resultTitle">성공!</h2><p id="resultText">목표를 달성했어요.</p><button class="btn cta" id="resultBtn">Play Now</button></div></div>
</div></div>
<script>
const CONFIG={maxPerCell:3,duration:45,goal:12,imageMode:false,ctaUrl:'https://play.google.com/store/apps/details?id=com.xpup.doll3match',imageMode:true,
types:{
  pink:{imageSrc:'images/Doll_1.png'},
  cream:{imageSrc:'images/Doll_2.png'},
  brown:{imageSrc:'images/Doll_3.png'},
  cat:{imageSrc:'images/Doll_4.png'},
  bean:{imageSrc:'images/Doll_5.png'},
  black:{imageSrc:'images/Doll_6.png'}

}};

const audio = {
  bgm: new Audio('sounds/InGameBGM.wav'),
  pick: new Audio('sounds/Pick.wav'),
  put: new Audio('sounds/Put.ogg'),
  good: new Audio('sounds/Combo_0.wav')
};

audio.bgm.loop = true;
audio.bgm.volume = 0.35;
audio.pick.volume = 0.65;
audio.put.volume = 0.75;
audio.good.volume = 0.95;

let audioUnlocked = false;
let bgmStarted = false;

function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;

  [audio.pick, audio.put, audio.good].forEach(a => {
    try{
      const p = a.play();
      if (p && typeof p.then === 'function') {
        p.then(() => {
          a.pause();
          a.currentTime = 0;
        }).catch(() => {});
      } else {
        a.pause();
        a.currentTime = 0;
      }
    }catch(e){}
  });

  startBGM();
}

function startBGM(){
  if(!audioUnlocked || bgmStarted) return;
  bgmStarted = true;
  try{
    const p = audio.bgm.play();
    if (p && typeof p.then === 'function') {
      p.catch(() => {
        bgmStarted = false;
      });
    }
  }catch(e){
    bgmStarted = false;
  }
}

function playSound(name){
  const src = audio[name];
  if(!src || !audioUnlocked || name === 'bgm') return;
  try{
    src.pause();
    src.currentTime = 0;
    const p = src.play();
    if (p && typeof p.then === 'function') p.catch(() => {});
  }catch(e){}
}

const BOARD_TEMPLATE=[
['cream','brown','black'],['pink','cream','black'],['pink','pink',null],['bean','bean',null],
['cat','brown',null],['pink','brown','brown'],['pink','cream',null],['cat','bean',null],
['bean','brown',null],['bean','pink',null],['cat','cat','brown'],['cream','pink','black'],
['cat','cream',null],['cream','cream',null],['cream','pink',null],['black',null,null],
['bean','black',null],['bean','cream',null],['cream','black',null],[null,null,null]
];
let state=null,timerInterval=null,dragState=null,toastTimer=null,lastDropIndex=null;
const boardEl=document.getElementById('board'),timerEl=document.getElementById('timer'),timeBarEl=document.getElementById('timeBar'),
progressEl=document.getElementById('progress'),goalEl=document.getElementById('goal'),movesEl=document.getElementById('moves'),
toastEl=document.getElementById('toast'),overlayEl=document.getElementById('overlay'),
resultTitleEl=document.getElementById('resultTitle'),resultTextEl=document.getElementById('resultText');
goalEl.textContent=CONFIG.goal;
document.getElementById('restartBtn').addEventListener('click',initGame);
document.getElementById('ctaBtn').addEventListener('click',openCTA);
document.getElementById('resultBtn').addEventListener('click',openCTA);
window.addEventListener('pointerdown', unlockAudio, { once:true });
window.addEventListener('keydown', unlockAudio, { once:true });

function initGame(){
  clearInterval(timerInterval);
  state={board:BOARD_TEMPLATE.map(s=>s.filter(Boolean)),progress:0,moves:0,remaining:CONFIG.duration,finished:false};
  cleanupDrag();
  overlayEl.classList.remove('show');
  render();
  timerInterval=setInterval(tick,1000);
}
function tick(){
  if(state.finished)return;
  state.remaining-=1;
  if(state.remaining<=0){state.remaining=0;renderHUD();endGame(false);return}
  renderHUD();
}
function render(){
  renderHUD();
  boardEl.innerHTML='';
  state.board.forEach((stack,index)=>{
    const cell=document.createElement('div');
    cell.className='cell';
    cell.dataset.index=index;
    if(stack.length===0){
      const hint=document.createElement('div');
      hint.className='slotHint';
      hint.textContent='+';
      cell.appendChild(hint);
    }
    stack.forEach((type,slotIndex)=>cell.appendChild(createPiece(type,slotIndex,index)));
    boardEl.appendChild(cell);
  });
}
function createPiece(type,slotIndex,cellIndex){
  const info=CONFIG.types[type],piece=document.createElement('div');
  piece.className='piece draggable';
  piece.dataset.cellIndex=cellIndex;
  piece.dataset.slotIndex=slotIndex;
  piece.dataset.type=type;

  const pos=[{left:20,top:52},{left:50,top:52},{left:80,top:52}][slotIndex] || {left:20,top:52};
  piece.style.left=pos.left+'%';
  piece.style.top=pos.top+'%';
  piece.style.transform='translate(-50%, -50%)';
  piece.addEventListener('pointerdown',startDrag);

  if(CONFIG.imageMode&&info.imageSrc){
    const img=document.createElement('img');
    img.src=info.imageSrc;
    img.alt=info.label;
    piece.appendChild(img);
  }else{
    const span=document.createElement('span');
    span.textContent=info.emoji;
    piece.appendChild(span);
  }
  const badge=document.createElement('div');
  badge.className='slotBadge';
  
  piece.appendChild(badge);
  return piece;
}
function startDrag(e){
  if(state.finished)return;
  cleanupDrag();
  playSound('pick');

  const piece=e.currentTarget;
  const fromIndex=Number(piece.dataset.cellIndex);
  const slotIndex=Number(piece.dataset.slotIndex);
  const type=piece.dataset.type;

  const ghost=piece.cloneNode(true);
  ghost.className='drag-ghost';
  ghost.style.left=e.clientX+'px';
  ghost.style.top=(e.clientY-18)+'px';
  document.body.appendChild(ghost);

  piece.classList.add('source-hidden');
  dragState={pointerId:e.pointerId,fromIndex,slotIndex,type,sourceEl:piece,ghostEl:ghost};
  lastDropIndex=null;

  window.addEventListener('pointermove',onDragMove,{passive:false});
  window.addEventListener('pointerup',endDrag,{passive:false});
  window.addEventListener('pointercancel',endDrag,{passive:false});
}
function onDragMove(e){
  if(!dragState||e.pointerId!==dragState.pointerId)return;
  e.preventDefault();
  dragState.ghostEl.style.left=e.clientX+'px';
  dragState.ghostEl.style.top=(e.clientY-18)+'px';

  const idx=getCellIndexAt(e.clientX,e.clientY);
  if(idx!==lastDropIndex){
    clearHighlights();
    lastDropIndex=idx;
    if(idx!==null && boardEl.children[idx]) boardEl.children[idx].classList.add('drop-target');
  }
}
function endDrag(e){
  if(!dragState||e.pointerId!==dragState.pointerId)return;
  e.preventDefault();
  const idx=getCellIndexAt(e.clientX,e.clientY);
  const {fromIndex,slotIndex}=dragState;
  cleanupDrag();
  if(idx===null){ render(); return; }
  moveAnyPiece(fromIndex,slotIndex,idx);
}
function cleanupDrag(){
  window.removeEventListener('pointermove',onDragMove);
  window.removeEventListener('pointerup',endDrag);
  window.removeEventListener('pointercancel',endDrag);
  clearHighlights();
  lastDropIndex=null;
  if(dragState){
    if(dragState.sourceEl) dragState.sourceEl.classList.remove('source-hidden');
    if(dragState.ghostEl && dragState.ghostEl.parentNode) dragState.ghostEl.parentNode.removeChild(dragState.ghostEl);
  }
  dragState=null;
}
function getCellIndexAt(x,y){
  for(let i=0;i<boardEl.children.length;i++){
    const rect=boardEl.children[i].getBoundingClientRect();
    if(x>=rect.left && x<=rect.right && y>=rect.top && y<=rect.bottom) return i;
  }
  return null;
}
function moveAnyPiece(fromIndex,slotIndex,toIndex){
  const from=state.board[fromIndex],to=state.board[toIndex];
  if(!from || slotIndex<0 || slotIndex>=from.length) { render(); return; }
  if(to.length>=CONFIG.maxPerCell){ flashInvalid(toIndex,'Full'); return; }

  const moving=from.splice(slotIndex,1)[0];
  playSound('put');
  to.push(moving);
  state.moves+=1;

  if(to.length===CONFIG.maxPerCell){
    const [a,b,c]=to;
    if(a===b && b===c){
      const clearedType=a;
      render();
      playMatchEffect(toIndex);
      playSound('good');
      setTimeout(()=>{
        state.board[toIndex]=[];
        state.progress+=1;
        showToast('success!');
        if(state.progress>=CONFIG.goal){
          state.progress=CONFIG.goal;
          render();
          endGame(true);
          return;
        }
        render();
      },320);
      return;
    }
  }
  render();
}

function playMatchEffect(cellIndex){
  const cell=boardEl.children[cellIndex];
  if(!cell) return;

  cell.classList.remove('match-flash');
  void cell.offsetWidth;
  cell.classList.add('match-flash');

  const bursts = [
    { dx:'-42px', dy:'-20px', s:'⭐' },
    { dx:'0px',   dy:'-34px', s:'✨' },
    { dx:'42px',  dy:'-18px', s:'⭐' },
    { dx:'-34px', dy:'14px',  s:'✨' },
    { dx:'34px',  dy:'14px',  s:'⭐' },
    { dx:'0px',   dy:'34px',  s:'✨' },
    { dx:'-18px', dy:'-4px',  s:'⭐' },
    { dx:'18px',  dy:'-2px',  s:'⭐' }
  ];

  bursts.forEach((b, i) => {
    const star = document.createElement('div');
    star.className = 'star-particle';
    star.textContent = b.s;
    star.style.setProperty('--dx', b.dx);
    star.style.setProperty('--dy', b.dy);
    star.style.animationDelay = `${i * 0.02}s`;
    cell.appendChild(star);

    setTimeout(() => {
      if (star.parentNode) star.parentNode.removeChild(star);
    }, 650);
  });

  setTimeout(()=>{
    if(cell) cell.classList.remove('match-flash');
  },260);
}

function clearHighlights(){
  document.querySelectorAll('.cell.drop-target').forEach(el=>el.classList.remove('drop-target'));
}
function flashInvalid(index,msg){
  const cell=boardEl.children[index];
  if(cell){
    cell.classList.remove('invalid');
    void cell.offsetWidth;
    cell.classList.add('invalid');
  }
  showToast(msg);
}
function showToast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'),800);
}
function renderHUD(){
  progressEl.textContent=state.progress;
  movesEl.textContent=state.moves;
  const m=String(Math.floor(state.remaining/60)).padStart(2,'0');
  const s=String(state.remaining%60).padStart(2,'0');
  timerEl.textContent=`${m}:${s}`;
  timeBarEl.style.width=`${(state.remaining/CONFIG.duration)*100}%`;
}
function endGame(win){
  if(state.finished)return;
  state.finished=true;
  clearInterval(timerInterval);
  resultTitleEl.textContent=win?'success!':'It is a waste!';
  resultTextEl.textContent=win?'installation is Free':'installation is Free';
  overlayEl.classList.add('show');
}
function openCTA(){ window.open(CONFIG.ctaUrl,'_blank'); }
initGame();
</script>
</body>
</html>
